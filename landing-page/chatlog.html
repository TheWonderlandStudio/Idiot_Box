    <a class="card" href="index.html">Chatlog</a>
    <nav class="nav-card">

        <span></span>

      <a href="chatlog.html">Chatlog</a>
      <a href="features.html">Features</a>

    </div>
    <main class="feed" id="feed">
      <h1 class="sr-only">Idiot Box release notes and updates</h1>
      <noscript>
        <div class="log-card">
          <h2 class="log-title">Idiot Box release notes</h2>
          <div class="log-body"><p>Idiot Box is a free, open-source desktop IDE for Windows. See the full changelog and download the latest release on GitHub.</p></div>
          <a class="log-dl" href="https://github.com/TheWonderlandStudio/Idiot_Box/releases" target="_blank" rel="noopener">Open releases on GitHub</a>
        </div>
      </noscript>
      <div class="log-card loading">Loading the log…</div>
    </main>
    <button id="update-my-app" class="update-app-fab" type="button" title="Trigger update check in your installed Idiot Box app">Update my app</button>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="audio.js"></script>
  <script src="page-transition.js"></script>
  <script>
    (function () {
      // mp4 background — src tag me set hai, bas play karo
      const video = document.getElementById('chatlog-bg');
      video.play().catch(function () {});
      video.addEventListener('canplay', function () { video.play().catch(function () {}); });

      // Release feed — live from GitHub
      const feed = document.getElementById('feed');
      // OS-aware asset picker — Linux visitors get AppImage (else deb), others get the Windows exe
      const IS_LINUX = /linux/i.test(navigator.userAgent || '') && !/android/i.test(navigator.userAgent || '');
      function pickReleaseAsset(assets) {
        const list = assets || [];
        if (IS_LINUX) {
          return list.find(function (a) { return /\.AppImage$/i.test(a.name); }) || list.find(function (a) { return /\.deb$/i.test(a.name); });
        }
        return list.find(function (a) { return /\.exe$/i.test(a.name) && !/blockmap/i.test(a.name); });
      }
      function assetLabel(url) {
        if (/\.AppImage$/i.test(url || '')) return 'Download .AppImage (Linux)';
        if (/\.deb$/i.test(url || '')) return 'Download .deb (Linux)';
        return 'Download .exe (Windows)';
      }
      // All installer options for a release — Windows exe + Linux AppImage/deb side by side
      function installerLinks(assets) {
        const list = assets || [];
        const exe = list.find(function (a) { return /\.exe$/i.test(a.name) && !/blockmap/i.test(a.name); });
        const appImage = list.find(function (a) { return /\.AppImage$/i.test(a.name); });
        const deb = list.find(function (a) { return /\.deb$/i.test(a.name); });
        const out = [];
        if (exe) out.push('<a class="log-dl" href="' + exe.browser_download_url + '">' + assetLabel(exe.browser_download_url) + '</a>');
        if (appImage) out.push('<a class="log-dl" href="' + appImage.browser_download_url + '">' + assetLabel(appImage.browser_download_url) + '</a>');
        if (deb && !appImage) out.push('<a class="log-dl" href="' + deb.browser_download_url + '">' + assetLabel(deb.browser_download_url) + '</a>');
        return out.join(' ');
      }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      function renderBody(md) {
        if (!md) return '';
        if (window.marked) return marked.parse(md);
        return esc(md);
      }
      fetch('https://api.github.com/repos/TheWonderlandStudio/Idiot_Box/releases?per_page=10')
        .then(function (res) { if (!res.ok) throw new Error('api failed'); return res.json(); })
        .then(function (releases) {
          if (!Array.isArray(releases) || !releases.length) throw new Error('empty');
          feed.innerHTML = '';
          releases.forEach(function (r) {
            const links = installerLinks(r.assets);
            const card = document.createElement('article');
            card.className = 'log-card';
            card.innerHTML =
              '<div class="log-meta"><span class="tag-pill">' + esc(r.tag_name) + '</span>' +
              '<span class="log-date">' + esc((r.published_at || '').slice(0, 10)) + '</span></div>' +
              '<h2 class="log-title">' + esc(r.name || r.tag_name) + '</h2>' +
              (r.body ? '<div class="log-body">' + renderBody(r.body) + '</div>' : '') +
              (links ? links : '');
            feed.appendChild(card);
          });
        })
        .catch(function () {
          feed.innerHTML = '<div class="log-card">Couldn\'t load the log. ' +
            '<a class="log-dl" href="https://github.com/TheWonderlandStudio/Idiot_Box/releases" target="_blank" rel="noopener">Open releases on GitHub</a></div>';
        });

      // Nav download — hamesha latest release ka installer (OS ke hisaab se)
      const FALLBACK = 'https://github.com/TheWonderlandStudio/Idiot_Box/releases';
      let cachedUrl = null;
      function resolveExeUrl() {
        if (cachedUrl) return Promise.resolve(cachedUrl);
        return fetch('https://api.github.com/repos/TheWonderlandStudio/Idiot_Box/releases/latest')
          .then(function (res) { if (!res.ok) throw new Error('api failed'); return res.json(); })
          .then(function (data) {
            const exe = pickReleaseAsset(data.assets);
            if (!exe) throw new Error('no installer');
            cachedUrl = exe.browser_download_url;
            return cachedUrl;
          });
      }
      document.querySelectorAll('[data-download-latest]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          const original = btn.textContent;
          btn.textContent = 'Locating…';
          resolveExeUrl().then(function (url) {
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();
          }).catch(function () {
            window.open(FALLBACK, '_blank', 'noopener');
          }).finally(function () {
            btn.textContent = original;
          });
        });
      });
      resolveExeUrl().catch(function () {});

      // "Update my app" — installed Idiot Box app ka updater trigger karo
      // via idiotbox://update deep link (app me protocol handler, v0.1.20+).
      // App installed + handler wala hoga to OS app kholega/focus karega aur
      // update check chalega. Nahi hoga to fallback message + download hint.
      (function () {
        var btn = document.getElementById('update-my-app');
        if (!btn) return;
        var original = btn.textContent;
        var timer = null;
        function setLabel(msg) { btn.textContent = msg; }
        function restore() { setLabel(original); btn.disabled = false; }
        btn.addEventListener('click', function () {
          if (timer) { clearTimeout(timer); timer = null; }
          btn.disabled = true;
          setLabel('Opening Idiot Box…');
          var launched = false;
          function onBlur() { launched = true; }
          function onVis() { if (document.hidden) launched = true; }
          window.addEventListener('blur', onBlur);
          document.addEventListener('visibilitychange', onVis);
          try { window.location.href = 'idiotbox://update'; } catch (e) {}
          timer = setTimeout(function () {
            window.removeEventListener('blur', onBlur);
            document.removeEventListener('visibilitychange', onVis);
            btn.disabled = false;
            if (launched || document.hidden) {
              setLabel('✓ Check started in app');
            } else {
              setLabel('App not found — download below ↓');
            }
            timer = setTimeout(restore, 4000);
          }, 1600);
        });
      })();

      // Hamburger menu (mobile) — size card jitni
      (function () {
        const bg = document.querySelector('.background');
        const btn = document.querySelector('.hamburger');
        const panel = document.getElementById('menu-panel');
        if (!btn || !panel) return;

        function setOpen(open) {
          bg.classList.toggle('menu-open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          setOpen(!bg.classList.contains('menu-open'));
        });

        panel.addEventListener('click', function (e) {
          if (e.target.closest('a')) setOpen(false);
        });

        document.addEventListener('click', function (e) {
          if (!e.target.closest('.menu-panel') && !e.target.closest('.hamburger')) setOpen(false);
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') setOpen(false);
        });
      })();
    })();
  </script>
</body>
