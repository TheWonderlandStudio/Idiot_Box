name: Security checks (PR)

# Fast + effective PR gate:
#  1. Gitleaks  -> blocks tokens/keys/secrets (.env.signing, GH tokens, etc.)
#  2. Dependency review -> blocks PRs adding known HIGH/CRITICAL CVEs
# No npm install, no CodeQL, so this finishes in ~30-60s.
#
# Dependabot (npm + actions) already handles weekly updates separately.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free license key stored as repo secret (Settings > Secrets >
          # Actions > GITLEAKS_LICENSE). Required since gitleaks-action v2.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-review:
    name: Dependency review
    # GitHub's dependency-review API only works on pull_request events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
